[project]
name = "stocksieve-backend"
version = "0.1.0"
description = "StockSieve 后端接口、行情同步、策略与分析服务"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiohttp==3.14.5",
  "deepagents>=0.7.32",
  "httpx==0.28.1",
  "langchain-openai>=1.7.3",
  "psycopg[binary]>=3.2,<4",
  "py-mini-racer>=0.6,<0.7",
  "pydantic==2.13.4",
  "python-docx>=1.2,<2",
  "reportlab>=4.4,<5",
  "sqlalchemy==2.1.6",
]

[dependency-groups]
dev = [
    "playwright>=1.55,<2",
    "pypdf>=6,<7",
    "pytest==9.1.1",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
