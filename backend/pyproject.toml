[project]
name = "stocksieve-backend"
version = "0.1.0"
description = "StockSieve 后端接口、行情同步、策略与分析服务"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiohttp==3.14.5",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "sqlalchemy==2.1.6",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.pytest.ini_options]
testpaths = ["tests", "tools/tests"]
pythonpath = ["src"]
